      <circle cx="278" cy="606" r="5"/><circle cx="352" cy="588" r="5"/><circle cx="404" cy="618" r="5"/>
      <circle cx="96" cy="628" r="5"/><circle cx="244" cy="628" r="5"/><circle cx="322" cy="628" r="5"/>
    </g>
    <g fill="#e59ab0" opacity="0.85">
      <circle cx="86" cy="586" r="4"/><circle cx="166" cy="602" r="4"/><circle cx="242" cy="584" r="4"/>
      <circle cx="316" cy="600" r="4"/><circle cx="382" cy="600" r="4"/><circle cx="126" cy="632" r="4"/>
      <circle cx="290" cy="630" r="4"/><circle cx="360" cy="632" r="4"/>
    </g>
    <g fill="#f4e9a8" opacity="0.9">
      <circle cx="44" cy="612" r="3"/><circle cx="196" cy="574" r="3"/><circle cx="266" cy="580" r="3"/>
      <circle cx="338" cy="616" r="3"/><circle cx="408" cy="594" r="3"/>
    </g>

    <!-- necklace of coloured beads -->
    <path d="M120 552 C150 590 214 594 250 556" fill="none" stroke="#8b7a5e" stroke-width="1.5" opacity="0.7"/>
    <circle cx="134" cy="566" r="6" fill="#6f8c3d"/>
    <circle cx="152" cy="578" r="6" fill="#3f6ea8"/>
    <circle cx="172" cy="586" r="6" fill="#b03040"/>
    <circle cx="192" cy="590" r="6" fill="#d9b04a"/>
    <circle cx="212" cy="586" r="6" fill="#5b8a52"/>
    <circle cx="230" cy="576" r="6" fill="#2f4f7f"/>
    <circle cx="244" cy="564" r="6" fill="#c06030"/>
