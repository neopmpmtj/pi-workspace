    <path d="M86 300 C84 258 100 222 130 202 C112 240 108 282 118 318 C126 348 142 364 160 372 C124 366 90 342 86 300 Z" fill="#6e4ca6" opacity="0.55"/>
    <!-- crown highlight -->
    <path d="M150 196 C214 178 288 206 314 262 C286 224 220 200 160 214 Z" fill="#8261bd" opacity="0.6"/>
    <!-- folded band across the back of the head -->
    <path d="M244 448 C286 440 314 408 322 366 C330 400 316 434 288 450 C276 457 258 452 244 448 Z" fill="#3a2559" opacity="0.5"/>
    <!-- fabric creases -->
    <path d="M180 196 C200 236 204 288 198 336" stroke="#4a3175" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M262 202 C276 246 278 300 268 352" stroke="#4a3175" stroke-width="3" fill="none" opacity="0.45"/>
  </g>

  <!-- ============ FACE ============ -->
  <g id="face">
