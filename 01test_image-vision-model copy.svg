      <circle cx="212" cy="146" r="4"/><circle cx="176" cy="156" r="4"/><circle cx="236" cy="148" r="4"/>
      <circle cx="256" cy="152" r="3.5"/><circle cx="196" cy="180" r="4"/><circle cx="216" cy="182" r="4"/>
    </g>

    <!-- yellow pear, right of the grapes -->
    <path d="M318 148 C338 148 348 166 348 184 C348 202 332 212 318 212 C304 212 288 202 288 184 C288 166 298 148 318 148 Z" fill="#e3d24f"/>
    <ellipse cx="306" cy="166" rx="9" ry="6" fill="#f2e694" opacity="0.8"/>

    <!-- green apple at the far right -->
    <ellipse cx="370" cy="170" rx="30" ry="29" fill="#6f9c37"/>
    <ellipse cx="360" cy="160" rx="12" ry="9" fill="#9dc160" opacity="0.8"/>

    <!-- deep red cherry / small apple low centre -->
    <ellipse cx="254" cy="216" rx="18" ry="17" fill="#8e1f2e"/>
    <ellipse cx="248" cy="208" rx="8" ry="6" fill="#bd4256" opacity="0.7"/>

