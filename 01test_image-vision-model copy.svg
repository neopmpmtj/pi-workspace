    <ellipse cx="80" cy="74" rx="20" ry="15" fill="#cfe06a" opacity="0.8"/>
    <path d="M92 50 C96 40 104 34 112 32" stroke="#5a4a22" stroke-width="4" fill="none"/>

    <!-- small red apple between apple and grapes -->
    <ellipse cx="150" cy="140" rx="22" ry="20" fill="#b32b3e"/>
    <ellipse cx="144" cy="132" rx="10" ry="7" fill="#d4556a" opacity="0.75"/>

    <!-- green grape cluster, upper right -->
    <g fill="#b9c98a">
      <circle cx="292" cy="104" r="9"/><circle cx="308" cy="112" r="9"/>
      <circle cx="283" cy="118" r="9"/><circle cx="300" cy="126" r="9"/>
      <circle cx="316" cy="128" r="8"/><circle cx="291" cy="133" r="9"/>
      <circle cx="308" cy="142" r="8"/>
    </g>
    <g fill="#cddb9f" opacity="0.8">
      <circle cx="290" cy="101" r="4"/><circle cx="281" cy="115" r="4"/><circle cx="306" cy="109" r="4"/>
    </g>

    <!-- dark purple grape cluster, centre -->
    <g fill="#4a2440">
      <circle cx="212" cy="132" r="11"/><circle cx="232" cy="134" r="11"/><circle cx="252" cy="138" r="11"/>
      <circle cx="196" cy="146" r="11"/><circle cx="216" cy="150" r="11"/><circle cx="236" cy="152" r="11"/>
      <circle cx="256" cy="156" r="10"/><circle cx="274" cy="150" r="10"/><circle cx="180" cy="160" r="11"/>
      <circle cx="200" cy="166" r="11"/><circle cx="220" cy="168" r="11"/><circle cx="240" cy="170" r="11"/>
      <circle cx="260" cy="172" r="10"/><circle cx="172" cy="176" r="10"/><circle cx="192" cy="184" r="11"/>
      <circle cx="212" cy="186" r="11"/><circle cx="232" cy="188" r="10"/><circle cx="250" cy="190" r="10"/>
      <circle cx="204" cy="202" r="10"/><circle cx="224" cy="204" r="9"/><circle cx="186" cy="200" r="9"/>
    </g>
    <g fill="#6b3f5e" opacity="0.85">
