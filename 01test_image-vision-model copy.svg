    <ellipse cx="292" cy="254" rx="27" ry="26" fill="#ced95a"/>
    <ellipse cx="283" cy="245" rx="11" ry="8" fill="#e6ee9a" opacity="0.8"/>

    <!-- small red fruit nestled at the turban edge -->
    <ellipse cx="222" cy="264" rx="16" ry="15" fill="#c2313f"/>
    <ellipse cx="217" cy="257" rx="7" ry="5" fill="#e06575" opacity="0.75"/>

    <!-- orange fruit cropped by the right edge -->
    <ellipse cx="404" cy="292" rx="28" ry="27" fill="#d98a2a"/>
    <ellipse cx="394" cy="282" rx="11" ry="8" fill="#efb35f" opacity="0.7"/>
  </g>

  <!-- ============ TURBAN ============ -->
  <g id="turban">
    <path d="M50 340 C38 250 104 182 190 182 C284 182 330 250 326 340 C322 402 296 444 244 448 L124 420 C76 402 58 380 50 340 Z" fill="#5b3d8f"/>
