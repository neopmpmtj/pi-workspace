    <path d="M18 606 C22 574 40 552 66 546 C84 542 96 552 96 566 C96 574 90 580 82 582 C72 584 64 592 62 604 C60 620 58 632 54 635 L24 635 C18 628 16 618 18 606 Z" fill="#d9a883"/>
    <path d="M96 566 C110 556 124 552 138 554 C148 556 150 566 142 572 C130 580 118 588 110 598 C104 606 100 616 98 626 L74 630 C80 606 88 580 96 566 Z" fill="#e0b08b"/>
