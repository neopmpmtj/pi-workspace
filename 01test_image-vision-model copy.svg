    <!-- chin / lower lip highlight -->
    <ellipse cx="140" cy="466" rx="24" ry="12" fill="#eec3a0" opacity="0.5"/>

    <!-- brows -->
    <path d="M62 328 C74 316 92 314 104 322 C90 318 76 320 64 330 Z" fill="#2a1a12"/>
    <path d="M162 316 C176 306 194 306 206 314 C192 310 176 312 164 320 Z" fill="#2a1a12"/>

    <!-- left eye (viewer's left) -->
    <path d="M58 344 C70 328 96 326 110 342 C96 356 70 358 58 344 Z" fill="#fdf8f3"/>
    <circle cx="86" cy="343" r="10" fill="#6b4a24"/>
    <circle cx="86" cy="343" r="4.6" fill="#191008"/>
    <circle cx="82" cy="339" r="1.8" fill="#ffffff" opacity="0.9"/>
    <path d="M58 344 C70 328 96 326 110 342" stroke="#1c1109" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M56 342 C56 332 60 326 66 322" stroke="#1c1109" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- right eye (viewer's right) -->
    <path d="M162 334 C176 318 200 318 212 334 C198 348 174 348 162 334 Z" fill="#fdf8f3"/>
    <circle cx="188" cy="333" r="10" fill="#6b4a24"/>
    <circle cx="188" cy="333" r="4.6" fill="#191008"/>
    <circle cx="184" cy="329" r="1.8" fill="#ffffff" opacity="0.9"/>
    <path d="M162 334 C176 318 200 318 212 334" stroke="#1c1109" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- nose -->
    <path d="M132 360 C128 384 124 400 118 410 C126 418 138 418 146 412" fill="none" stroke="#b9835a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="120" cy="414" rx="5" ry="3.5" fill="#a06e46" opacity="0.8"/>
    <ellipse cx="146" cy="412" rx="5" ry="3.5" fill="#a06e46" opacity="0.8"/>

    <!-- lips -->
    <path d="M96 436 C110 424 130 424 144 432 C132 440 110 444 96 436 Z" fill="#a4142c"/>
    <path d="M96 436 C110 446 132 448 146 438 C134 456 106 456 96 436 Z" fill="#c0203a"/>
    <path d="M104 436 C118 432 132 433 142 437" stroke="#7d0d20" stroke-width="2" fill="none" opacity="0.8"/>
    <ellipse cx="122" cy="446" rx="8" ry="3" fill="#e2697d" opacity="0.55"/>

    <!-- blush -->
    <ellipse cx="84" cy="400" rx="20" ry="12" fill="#d98d7a" opacity="0.35" transform="rotate(-15 84 400)"/>
    <ellipse cx="196" cy="386" rx="18" ry="11" fill="#d98d7a" opacity="0.3" transform="rotate(-10 196 386)"/>
  </g>

  <!-- ============ EARRING ============ -->
  <g id="earring">
    <ellipse cx="228" cy="432" rx="5" ry="6" fill="#e4d6b4"/>
    <circle cx="248" cy="424" r="17" fill="#d8c9a8"/>
    <circle cx="248" cy="424" r="11" fill="none" stroke="#a8916c" stroke-width="2"/>
    <circle cx="248" cy="424" r="5" fill="#efe6cf"/>
    <path d="M236 438 C244 448 254 448 262 438 C258 452 240 452 236 438 Z" fill="#cfc09c"/>
  </g>

