    <path d="M74 300 C70 272 82 250 104 240 C92 262 86 288 88 314 C90 340 98 358 110 372 C86 362 76 334 74 300 Z" fill="#241611"/>
    <path d="M240 268 C256 276 266 296 268 320 C256 300 244 284 230 276 Z" fill="#241611" opacity="0.9"/>

