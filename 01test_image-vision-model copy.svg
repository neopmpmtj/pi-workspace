<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 635" width="423" height="635">
  <title>Portrait with a fruit headdress (stylized vector rendering of 01test_image-vision-model.jpeg)</title>
  <desc>Studio-style portrait of a woman in a purple turban crowned with a surplus of fruit, in the manner of a Carmen Miranda / food-editorial shoot.</desc>

  <!-- studio background -->
  <rect width="423" height="635" fill="#f7f5f1"/>

  <!-- ============ FRUIT CROWN ============ -->
  <g id="headdress">
    <!-- foliage behind the fruit -->
    <path d="M250 120 C300 105 340 130 345 165 C320 150 290 145 262 152 Z" fill="#5d6b2c"/>
    <path d="M275 185 C325 175 360 200 362 232 C332 214 300 208 272 214 Z" fill="#46521f"/>
    <path d="M185 145 C215 118 250 112 272 128 C245 132 220 148 205 168 Z" fill="#6b7a33"/>

    <!-- tall yellow fruit rising out of frame, top centre -->
    <path d="M198 78 C196 46 206 18 218 0 L246 0 C236 24 232 52 234 80 Z" fill="#e8ce42"/>
    <path d="M204 76 C203 50 210 24 220 6 L228 6 C220 28 216 52 218 78 Z" fill="#f4e178" opacity="0.7"/>

    <!-- large red apple, upper centre-left -->
    <ellipse cx="150" cy="60" rx="46" ry="43" fill="#a5273a"/>
    <ellipse cx="138" cy="46" rx="24" ry="18" fill="#c8495c" opacity="0.75"/>
    <path d="M150 20 C154 10 160 4 168 2" stroke="#4d3320" stroke-width="4" fill="none"/>

    <!-- green-gold apple, upper left -->
