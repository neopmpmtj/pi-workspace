<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="SVG demo: gradient background, shapes, text and an animation">
  <title>SVG demo</title>

  <defs>
    <!-- background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#15204a"/>
      <stop offset="100%" stop-color="#2b1b4d"/>
    </linearGradient>

    <!-- gradient for the rotating ring -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4cc9f0"/>
      <stop offset="50%" stop-color="#b5179e"/>
      <stop offset="100%" stop-color="#f72585"/>
    </linearGradient>

    <!-- soft glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="640" height="320" fill="url(#bg)"/>

  <!-- dotted grid -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="40" cy="40" r="1.6"/>
    <circle cx="120" cy="40" r="1.6"/>
    <circle cx="200" cy="40" r="1.6"/>
    <circle cx="280" cy="40" r="1.6"/>
    <circle cx="360" cy="40" r="1.6"/>
    <circle cx="440" cy="40" r="1.6"/>
    <circle cx="520" cy="40" r="1.6"/>
    <circle cx="600" cy="40" r="1.6"/>
    <circle cx="40" cy="280" r="1.6"/>
    <circle cx="120" cy="280" r="1.6"/>
    <circle cx="200" cy="280" r="1.6"/>
    <circle cx="280" cy="280" r="1.6"/>
    <circle cx="360" cy="280" r="1.6"/>
    <circle cx="440" cy="280" r="1.6"/>
    <circle cx="520" cy="280" r="1.6"/>
    <circle cx="600" cy="280" r="1.6"/>
  </g>

  <!-- rotating dashed ring -->
  <g transform="translate(150 160)">
    <circle r="84" fill="none" stroke="url(#ring)" stroke-width="3"
            stroke-dasharray="18 12" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <!-- pulsing core -->
    <circle r="34" fill="#4cc9f0" opacity="0.85" filter="url(#glow)">
      <animate attributeName="r" values="30;38;30" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- rounded card on the right -->
  <g transform="translate(300 62)">
    <rect width="300" height="196" rx="16" fill="#ffffff" opacity="0.07"
          stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="24" y="52" font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="26" font-weight="700" fill="#ffffff">Hello, SVG</text>
    <text x="24" y="82" font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="13" fill="#9fb3d9">vector · scalable · animatable</text>

    <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#dbe6ff">
      <text x="24" y="118">• shapes, paths, gradients</text>
      <text x="24" y="140">• text as real text (selectable)</text>
      <text x="24" y="162">• declarative animation via SMIL</text>
    </g>

    <!-- tiny bar chart to show geometry -->
    <g transform="translate(24 176)">
      <rect x="0" y="0" width="10" height="18" rx="2" fill="#4cc9f0"/>
      <rect x="18" y="-6" width="10" height="24" rx="2" fill="#b5179e"/>
      <rect x="36" y="-12" width="10" height="30" rx="2" fill="#f72585"/>
      <rect x="54" y="-3" width="10" height="21" rx="2" fill="#7209b7"/>
    </g>
  </g>

  <!-- footer -->
  <text x="600" y="300" text-anchor="end"
        font-family="Inter, Helvetica, Arial, sans-serif" font-size="11"
        fill="#ffffff" opacity="0.45">hello.svg</text>
</svg>
