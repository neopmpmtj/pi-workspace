[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "explain-like-12"
version = "0.1.0"
description = "ExplainLike12: clipboard text -> LLM explanation for a bright 12-year-old -> pasted at cursor"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
