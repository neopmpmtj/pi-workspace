<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codebase Summary — Pi Dashboard</title>
  <link rel="stylesheet" href="/codebase-summary/style.css">
</head>
<body>
  <div class="container">
    <!-- Back link -->
    <a href="/" class="back-link">← Back to Dashboard</a>

    <!-- Header -->
    <h1>Codebase Summary</h1>
    <p class="subtitle">
      Live, AI-generated summary of the Pi codebase at <code>~/.pi</code>.
      Click <strong>Update</strong> to regenerate — up to 3 historical snapshots are kept.
    </p>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="btn-update" class="btn primary">&#x21bb; Update</button>
        <div class="status-badge">
          <span id="status-dot" class="status-dot idle"></span>
          <span id="status-text">Loading...</span>
        </div>
      </div>
      <div class="toolbar-right">
        <div class="toggle-group">
          <button id="toggle-md" class="toggle-btn active">Markdown</button>
          <button id="toggle-json" class="toggle-btn">Raw JSON</button>
        </div>
      </div>
    </div>

    <!-- Content area -->
    <div id="content-area" class="content-area">
      <div class="content-empty">
        <div class="spinner large"></div>
        <div class="empty-text">Loading...</div>
      </div>
    </div>

    <!-- History section -->
    <div id="history-section" class="history-section">
      <h2>History</h2>
      <div id="history-list" class="history-list">
        <div class="history-empty">Loading...</div>
      </div>
    </div>
  </div>

  <script src="/codebase-summary/app.js"></script>
</body>
</html>
