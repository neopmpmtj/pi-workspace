<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Spend Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --border:   #2a2d3a;
      --text:     #e1e4ed;
      --muted:    #8b8fa3;
      --accent:   #6c8cff;
      --green:    #4ade80;
      --orange:   #fb923c;
      --red:      #f87171;
      --purple:   #c084fc;
      --cyan:     #22d3ee;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 16px; }

    /* ── Filter Bar ────────────────────── */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 28px;
    }
    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Cards ─────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }
    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .card-value {
      font-size: 1.75rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .card-value.tokens  { color: var(--accent); }
    .card-value.cost    { color: var(--green); }
    .card-value.int     { color: var(--cyan); }

    /* ── Charts ────────────────────────── */
    .charts {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (max-width: 768px) { .charts { grid-template-columns: 1fr; } }

    .chart-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }
    .chart-box h2 {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .chart-wrap { position: relative; width: 100%; }
    .chart-wrap canvas { max-height: 280px; }

    /* ── Conversations Table ───────────── */
    .section-title {
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 10px 16px;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      font-weight: 600;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(255,255,255,0.02);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .conv-row { cursor: pointer; }
    .conv-row.expanded td { border-bottom: none; }
    .expand-icon { display: inline-block; transition: transform 0.2s; margin-right: 6px; }
    .conv-row.expanded .expand-icon { transform: rotate(90deg); }

    /* Turn details sub-row */
    .turn-detail {
      display: none;
      background: rgba(0,0,0,0.2);
    }
    .turn-detail.show { display: table-row; }
    .turn-detail td { padding: 0; }
    .turn-detail-inner {
      padding: 12px 16px 12px 48px;
    }
    .turn-item {
      display: flex;
      gap: 16px;
      padding: 6px 0;
      font-size: 0.8rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      align-items: center;
    }
    .turn-item:last-child { border-bottom: none; }
    .turn-role {
      width: 70px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }
    .turn-role.user       { color: var(--accent); }
    .turn-role.assistant  { color: var(--green); }
    .turn-role.system     { color: var(--purple); }
    .turn-role.toolResult { color: var(--orange); }
    .turn-stats { color: var(--muted); display: flex; gap: 20px; flex-wrap: wrap; }
    .turn-stat-val { color: var(--text); font-weight: 600; }

    .model-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(108,140,255,0.15);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .cost-cell { font-family: monospace; color: var(--green); }
    .token-cell { font-family: monospace; }

    .back-link {
      display: inline-block;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      margin-bottom: 20px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state p { font-size: 1rem; margin-bottom: 4px; }
    .empty-state .hint { font-size: 0.8rem; }

    .loading { opacity: 0.5; pointer-events: none; }
    .error-banner {
      background: rgba(248,113,113,0.1);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      display: none;
    }

    /* ── Detail Button ────────────────── */
    .detail-btn-wrap {
      text-align: center;
      margin-bottom: 24px;
      display: none;
    }
    .detail-btn-wrap.visible { display: block; }
    .detail-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 28px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: rgba(108,140,255,0.08);
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
      font-family: inherit;
    }
    .detail-btn:hover {
      background: rgba(108,140,255,0.18);
      border-color: #8aa8ff;
      color: #c4d4ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">&larr; Back to Dashboard</a>
    <h1>Token Spend</h1>
    <p class="subtitle" id="live-indicator">Ready</p>

    <!-- Filter Bar -->
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn" data-filter="today">Today</button>
      <button class="filter-btn active" data-filter="week">Week</button>
      <button class="filter-btn" data-filter="month">Month</button>
      <button class="filter-btn" data-filter="year">Year</button>
      <button class="filter-btn" data-filter="all">All</button>
    </div>

    <div class="error-banner" id="error-banner"></div>

    <!-- Summary Cards -->
    <div class="cards" id="cards">
      <div class="card">
        <div class="card-label">Total Tokens</div>
        <div class="card-value tokens" id="val-tokens">—</div>
      </div>
      <div class="card">
        <div class="card-label">Total Cost</div>
        <div class="card-value cost" id="val-cost">—</div>
      </div>
      <div class="card">
        <div class="card-label">Conversations</div>
        <div class="card-value int" id="val-convs">—</div>
      </div>
      <div class="card">
        <div class="card-label">Cache Hit Savings</div>
        <div class="card-value int" id="val-cache">—</div>
      </div>
    </div>

    <!-- Detail button (only visible on Today filter) -->
    <div class="detail-btn-wrap" id="detail-btn-wrap">
      <a href="/token-tracker/today" class="detail-btn">
        &#x1F50D; View Day Details
      </a>
    </div>

    <!-- Charts -->
    <div class="charts">
      <div class="chart-box">
        <h2>Daily Token Usage</h2>
        <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
      </div>
      <div class="chart-box">
        <h2>By Model</h2>
        <div class="chart-wrap"><canvas id="chart-models"></canvas></div>
      </div>
    </div>

    <!-- Agent Breakdown -->
    <div class="chart-box agent-chart" style="margin-bottom: 32px;">
      <h2>Token Usage by Agent</h2>
      <div class="chart-wrap"><canvas id="chart-agents"></canvas></div>
    </div>

    <!-- Conversations -->
    <h2 class="section-title">Conversations</h2>
    <table>
      <thead>
        <tr>
          <th></th>
          <th>Date</th>
          <th>Agent</th>
          <th>Model</th>
          <th>Turns</th>
          <th>Tokens</th>
          <th>Cost</th>
        </tr>
      </thead>
      <tbody id="conv-tbody">
        <tr><td colspan="7" class="empty-state"><p>No data yet</p><p class="hint">Use record_turn.mjs to start logging</p></td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ── Utils ─────────────────────────────
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    function fmt(n, decimals = 0) {
      if (n == null || isNaN(n)) return '—';
      return Number(n).toLocaleString('en-US', { maximumFractionDigits: decimals });
    }

    function fmtCost(n) {
      if (n == null || isNaN(n)) return '—';
      return '$' + Number(n).toFixed(4);
    }

    function showError(msg) {
      const el = $('#error-banner');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() { $('#error-banner').style.display = 'none'; }

    async function api(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`API ${path} returned ${res.status}`);
      return res.json();
    }

    function setVal(id, val, fmtFn) {
      const el = $(id);
      if (el) el.textContent = fmtFn ? fmtFn(val) : val;
    }

    // ── Charts ────────────────────────────
    let dailyChart, modelChart, agentChart;

    function initDailyChart() {
      const ctx = $('#chart-daily').getContext('2d');
      dailyChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: [],
          datasets: [
            { label: 'Input',  data: [], backgroundColor: 'rgba(108,140,255,0.6)',  borderRadius: 4 },
            { label: 'Output', data: [], backgroundColor: 'rgba(74,222,128,0.6)',   borderRadius: 4 },
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          stacked: true,
          plugins: { legend: { labels: { color: '#8b8fa3', font: { size: 11 } } } },
          scales: {
            x: { stacked: true, ticks: { color: '#8b8fa3', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
            y: { stacked: true, ticks: { color: '#8b8fa3', font: { size: 10 }, callback: v => fmt(v) }, grid: { color: 'rgba(255,255,255,0.04)' } }
          },
          interaction: { mode: 'index', intersect: false }
        }
      });
    }

    function initModelChart() {
      const ctx = $('#chart-models').getContext('2d');
      modelChart = new Chart(ctx, {
        type: 'doughnut',
        data: { labels: [], datasets: [{ data: [], backgroundColor: ['#6c8cff','#4ade80','#fb923c','#c084fc','#22d3ee','#f87171'] }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#8b8fa3', font: { size: 10 }, padding: 12 } } }
        }
      });
    }

    function initAgentChart() {
      const ctx = $('#chart-agents').getContext('2d');
      const palette = ['#6c8cff','#4ade80','#fb923c','#c084fc','#22d3ee','#f87171'];
      agentChart = new Chart(ctx, {
        type: 'bar',
        data: { labels: [], datasets: [{ data: [], backgroundColor: [] }] },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => 'Total tokens: ' + fmt(ctx.raw)
              }
            }
          },
          scales: {
            x: { ticks: { color: '#8b8fa3', font: { size: 10 }, callback: v => fmt(v) }, grid: { color: 'rgba(255,255,255,0.04)' } },
            y: { ticks: { color: '#8b8fa3', font: { size: 11 } }, grid: { display: false } }
          }
        }
      });
    }

    // ── Filters ──────────────────────────
    let currentFilter = 'week';

    function getDateRange(filter) {
      const now = new Date();
      const to = now.toISOString().split('T')[0];
      let from;
      switch (filter) {
        case 'today': from = to; break;
        case 'week':  from = new Date(now - 7 * 86400000).toISOString().split('T')[0]; break;
        case 'month': from = new Date(now - 30 * 86400000).toISOString().split('T')[0]; break;
        case 'year':  from = new Date(now - 365 * 86400000).toISOString().split('T')[0]; break;
        default:      return ''; // 'all' — no filter
      }
      return `?from=${from}&to=${to}`;
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.filter === filter);
      });
      // Show/hide detail button
      const detailWrap = document.getElementById('detail-btn-wrap');
      if (detailWrap) {
        detailWrap.classList.toggle('visible', filter === 'today');
      }
      loadAll();
    }

    document.getElementById('filter-bar').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        setFilter(e.target.dataset.filter);
      }
    });

    // ── Load & Render ─────────────────────
    async function loadAll() {
      hideError();
      const qs = getDateRange(currentFilter);
      try {
        const [summary, daily, models, agents, conversations] = await Promise.all([
          api('/api/summary' + qs),
          api('/api/daily' + qs),
          api('/api/models' + qs),
          api('/api/agents' + qs),
          api('/api/conversations' + qs),
        ]);

        renderSummary(summary);
        renderDailyChart(daily);
        renderModelChart(models);
        renderAgentChart(agents);
        renderConversations(conversations);

        updateLiveIndicator();
      } catch (err) {
        showError('Failed to load data: ' + err.message);
        console.error(err);
      }
    }

    function renderSummary(s) {
      setVal('#val-tokens', s.total_tokens, fmt);
      setVal('#val-cost',   s.total_cost, fmtCost);
      setVal('#val-convs',  s.total_conversations, fmt);
      setVal('#val-cache',  s.total_cache_hit_tokens, fmt);
    }

    function renderDailyChart(data) {
      dailyChart.data.labels   = data.map(d => d.day);
      dailyChart.data.datasets[0].data = data.map(d => d.input_tokens);
      dailyChart.data.datasets[1].data = data.map(d => d.output_tokens);
      dailyChart.update();
    }

    function renderModelChart(data) {
      modelChart.data.labels = data.map(d => d.model);
      modelChart.data.datasets[0].data = data.map(d => d.total_tokens);
      modelChart.update();
    }

    function renderAgentChart(data) {
      const palette = ['#6c8cff','#4ade80','#fb923c','#c084fc','#22d3ee','#f87171'];
      agentChart.data.labels = data.map(d => d.agent_name);
      agentChart.data.datasets[0].data = data.map(d => d.total_tokens);
      agentChart.data.datasets[0].backgroundColor = data.map((_, i) => palette[i % palette.length]);
      agentChart.update();
    }

    function renderConversations(convs) {
      const tbody = $('#conv-tbody');
      if (!convs.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><p>No data yet</p><p class="hint">Use record_turn.mjs to start logging</p></td></tr>';
        return;
      }

      tbody.innerHTML = convs.map(c => `
        <tr class="conv-row" data-id="${c.id}" onclick="toggleConversation(${c.id})">
          <td><span class="expand-icon">▶</span></td>
          <td>${c.started_at ? c.started_at.split(' ')[0] : '—'}</td>
          <td><span class="model-badge">${esc(c.agent_name || '—')}</span></td>
          <td><span class="model-badge">${esc(c.model || 'unknown')}</span></td>
          <td class="token-cell">${fmt(c.turn_count)}</td>
          <td class="token-cell">${fmt(c.total_tokens)}</td>
          <td class="cost-cell">${fmtCost(c.total_cost)}</td>
        </tr>
        <tr class="turn-detail" id="turns-${c.id}">
          <td colspan="7"><div class="turn-detail-inner">Loading…</div></td>
        </tr>
      `).join('');
    }

    async function toggleConversation(id) {
      const row = document.querySelector(`.conv-row[data-id="${id}"]`);
      const detail = $(`#turns-${id}`);

      if (detail.classList.contains('show')) {
        detail.classList.remove('show');
        row.classList.remove('expanded');
        return;
      }

      // Fetch turns if not already loaded
      const inner = detail.querySelector('.turn-detail-inner');
      if (inner.textContent === 'Loading…') {
        try {
          const turns = await api(`/api/conversations/${id}/turns`);
          inner.innerHTML = turns.map(t => `
            <div class="turn-item">
              <span class="turn-role ${t.role}">${t.role}</span>
              <span class="turn-stats">
                <span>In: <span class="turn-stat-val">${fmt(t.input_tokens)}</span></span>
                <span>Out: <span class="turn-stat-val">${fmt(t.output_tokens)}</span></span>
                <span>Total: <span class="turn-stat-val">${fmt(t.total_tokens)}</span></span>
                ${t.cache_hit_tokens ? `<span>Cache hit: <span class="turn-stat-val">${fmt(t.cache_hit_tokens)}</span></span>` : ''}
                ${t.cost ? `<span>Cost: <span class="turn-stat-val">${fmtCost(t.cost)}</span></span>` : ''}
              </span>
            </div>
          `).join('');
        } catch (err) {
          inner.innerHTML = `<span style="color:var(--red)">Failed to load: ${esc(err.message)}</span>`;
        }
      }

      detail.classList.add('show');
      row.classList.add('expanded');
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function updateLiveIndicator() {
      const now = new Date().toLocaleTimeString();
      const label = currentFilter.charAt(0).toUpperCase() + currentFilter.slice(1);
      $('#live-indicator').textContent = `Last updated: ${now} · auto-refresh every 30s · ${label}`;
    }

    // ── Init ──────────────────────────────
    initDailyChart();
    initModelChart();
    initAgentChart();
    loadAll();
    setInterval(loadAll, 30_000);
  </script>
</body>
</html>
